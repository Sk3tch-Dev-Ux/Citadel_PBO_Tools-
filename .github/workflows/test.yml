name: test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Tk runtime
        # tkinter ships with CPython but the Tcl/Tk system libraries are not
        # always present on Ubuntu runners. Install them so anything that
        # touches tkinter imports cleanly.
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest -v --tb=short

  smoke-import:
    name: Smoke import on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Import every module
        # Tk is present on Windows runners by default. Confirm GUI modules
        # import without bringing up any actual windows.
        run: |
          python -c "from citadel.core import pbo, lzss, prefix, theme, settings, cache, dayz_tools, paths, log, signing, assets; from citadel.builder import discovery, pipeline, preflight, presets; from citadel.inspector import p3d_meta, viewer; from citadel.gui import builder_app, inspector_app, options_dialog, widgets; print('all imports ok')"
      - run: python -m pytest -v --tb=short
